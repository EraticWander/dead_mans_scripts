services:
  dead_mans_scripts:
    build:
      context: .
      dockerfile: Dockerfile
    image: dead_mans_scripts:latest
    container_name: dead_mans_scripts
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-5000}:80"
    env_file:
      - path: .env
        required: false
    environment:
      - PORT=80
      - FLASK_DEBUG=${FLASK_DEBUG:-false}

