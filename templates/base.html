<!doctype html>
<html lang="en">
<head>
    <title>{% block title %}Image Encoder{% endblock %}</title>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <style>
        body { margin: 20px; font-family: Arial, sans-serif; }
        textarea, input[type="text"] { width: 40%; padding: 8px; }
        .loading {
                font-size: 16px;
                font-style: italic;
                color: #555;
            }
        .error {
                color: red;
                font-size: 14px;
            }
    </style>
</head>
<body>
    <!-- Navigation bar -->
    <ul class="nav nav-tabs">
        <li class="nav-item">
            <a class="nav-link {% if request.endpoint == 'encrypt_image' %}active{% endif %}" aria-current="page" href="{{ url_for('encrypt_image') }}">Encode Image</a>
        </li>
        <li class="nav-item">
            <a class="nav-link {% if request.endpoint == 'decrypt_image' %}active{% endif %}" aria-current="page" href="{{ url_for('decrypt_image') }}">Decode Image</a>
        </li>
    </ul>
    
    {% block content %}
    {% endblock %}
</body>
</html>
