<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}StegoVault — Image Steganography Studio{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-surface: #0f172a;
            --bg-card: #1e293b;
            --bg-input: #0f172a;
            --border-subtle: #334155;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-blue: #3b82f6;
            --accent-indigo: #6366f1;
            --accent-emerald: #10b981;
        }

        body {
            background-color: var(--bg-surface);
            color: var(--text-primary);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            padding-bottom: 3rem;
        }

        .navbar-brand-bar {
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-subtle);
            padding: 0.85rem 0;
            margin-bottom: 2rem;
        }

        .studio-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: 14px;
            box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.45);
            height: 100%;
        }

        .step-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-indigo));
            color: #fff;
            font-weight: 700;
            font-size: 0.85rem;
            margin-right: 0.6rem;
            flex-shrink: 0;
        }

        .dropzone {
            border: 2px dashed #475569;
            border-radius: 12px;
            background-color: rgba(15, 23, 42, 0.65);
            padding: 1.5rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
        }

        .dropzone:hover, .dropzone.dragover {
            border-color: var(--accent-blue);
            background-color: rgba(59, 130, 246, 0.08);
        }

        .preview-thumb {
            max-height: 150px;
            max-width: 100%;
            border-radius: 8px;
            object-fit: contain;
            border: 1px solid var(--border-subtle);
            background: #090d16;
        }

        .form-control, .input-group-text {
            background-color: var(--bg-input);
            border-color: var(--border-subtle);
            color: var(--text-primary);
        }

        .form-control:focus {
            background-color: var(--bg-input);
            border-color: var(--accent-blue);
            color: var(--text-primary);
            box-shadow: 0 0 0 0.2rem rgba(59, 130, 246, 0.25);
        }

        .form-control::placeholder {
            color: #64748b;
        }

        .message-editor {
            font-family: "JetBrains Mono", "Fira Code", Consolas, monospace;
            font-size: 0.94rem;
            line-height: 1.55;
            min-height: 260px;
            overflow-y: hidden;
            resize: vertical;
        }

        .workflow-pill {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.35rem 0.75rem;
            border-radius: 999px;
            font-size: 0.78rem;
            font-weight: 600;
            letter-spacing: 0.02em;
        }

        .pill-idle {
            background: rgba(148, 163, 184, 0.15);
            color: #cbd5e1;
        }

        .pill-decoded {
            background: rgba(16, 185, 129, 0.18);
            color: #34d399;
            border: 1px solid rgba(16, 185, 129, 0.35);
        }

        .pill-edited {
            background: rgba(245, 158, 11, 0.18);
            color: #fbbf24;
            border: 1px solid rgba(245, 158, 11, 0.35);
        }

        .btn-decode {
            background-color: #1e293b;
            border: 1px solid var(--accent-blue);
            color: #60a5fa;
            font-weight: 600;
        }

        .btn-decode:hover:not(:disabled) {
            background-color: var(--accent-blue);
            color: #fff;
        }

        .btn-encode {
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-indigo));
            border: none;
            color: #fff;
            font-weight: 600;
        }

        .btn-encode:hover:not(:disabled) {
            filter: brightness(1.08);
            color: #fff;
        }

        .text-muted-custom {
            color: var(--text-secondary) !important;
        }
    </style>
</head>
<body>
    <header class="navbar-brand-bar">
        <div class="container d-flex flex-wrap justify-content-between align-items-center">
            <div class="d-flex align-items-center gap-2">
                <i class="bi bi-shield-lock-fill fs-4 text-primary"></i>
                <div>
                    <span class="fw-bold fs-5">Dead Man's Stego Studio</span>
                    <span class="d-none d-md-inline text-muted-custom ms-2 small">AES-256 Image Steganography — Decode, Edit &amp; Re-Encode</span>
                </div>
            </div>
            <button type="button" id="resetWorkspaceBtn" class="btn btn-sm btn-outline-secondary text-light border-secondary">
                <i class="bi bi-arrow-counterclockwise me-1"></i>Reset Workspace
            </button>
        </div>
    </header>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
